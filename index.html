<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VidaAtiva</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icone-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app"><p class="intro">A carregar…</p></main>
  <script>
    // Aberto por duplo clique no ficheiro? Os módulos e o fetch não funcionam
    // em file://, por isso explicamos em vez de deixar "A carregar…" para sempre.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<h1 class="marca" style="margin:16px 0">VidaAtiva</h1>' +
        '<p class="intro">Esta página não funciona aberta directamente do ficheiro. Precisa de um servidor HTTP.</p>' +
        '<p class="intro">Na pasta do projecto, correr <code>python3 -m http.server 8080</code> e abrir <code>http://localhost:8080</code>. Ou publicar em GitHub Pages e abrir no telemóvel.</p>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
